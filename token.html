<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDC Token Purchase and Digital Token Generation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
            background-color: #f4f4f4;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .card {
            margin-top: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #4CAF50;
            color: white;
        }
        .download-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-center">Buy SDC Token</h1>
        
        <div class="card">
            <div class="card-header">
                <h5>Token Purchase and Digital Token Creation</h5>
            </div>
            <div class="card-body">
                <form id="purchase-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username:</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                    </div>

                    <div class="mb-3">
                        <label for="user-photo" class="form-label">Upload Your Photo:</label>
                        <input type="file" class="form-control" id="user-photo" accept="image/*" required>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (ZAR):</label>
                        <input type="number" class="form-control" id="amount" placeholder="Enter amount in ZAR" required>
                    </div>

                    <button type="submit" class="btn btn-success">Buy Token</button>
                </form>
            </div>
        </div>

        <!-- Display Token after Purchase -->
        <div class="card" id="digital-token-card" style="display:none;">
            <div class="card-header">
                <h5>Your SDC Digital Token</h5>
            </div>
            <div class="card-body text-center">
                <h6>Username: <span id="display-username"></span></h6>
                <img id="display-photo" src="" alt="User Photo" style="width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px;">
                <h6>Amount Paid: <span id="display-amount"></span> ZAR</h6>
                <button class="download-btn" id="download-json">Download as JSON</button>
                <button class="download-btn" id="download-pdf">Download as PDF</button>
                <button class="download-btn" id="download-png">Download as PNG</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script>
        // Handle Token Purchase and Digital Token Generation
        document.getElementById('purchase-form').addEventListener('submit', function(e) {
            e.preventDefault();

            // Fetch the user inputs
            const username = document.getElementById('username').value;
            const photoInput = document.getElementById('user-photo');
            const amount = document.getElementById('amount').value;

            // Validate that amount is valid and greater than 0
            if (amount <= 0) {
                alert('Please enter a valid amount.');
                return;
            }

            // Create a digital token (simulated)
            const reader = new FileReader();
            reader.onload = function(e) {
                const photoData = e.target.result;

                // Remove colors from the photo (making it monochrome)
                const img = new Image();
                img.src = photoData;
                img.onload = function() {
                    // Convert image to grayscale
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixels = imgData.data;

                    // Apply grayscale effect (RGB => R = G = B)
                    for (let i = 0; i < pixels.length; i += 4) {
                        const avg = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                        pixels[i] = pixels[i + 1] = pixels[i + 2] = avg; // R, G, B to avg
                    }

                    ctx.putImageData(imgData, 0, 0);

                    // Convert the processed image to data URL (monochrome version)
                    const grayPhoto = canvas.toDataURL();
                    document.getElementById('display-username').textContent = username;
                    document.getElementById('display-amount').textContent = amount;
                    document.getElementById('display-photo').src = grayPhoto;

                    // Show the digital token card
                    document.getElementById('digital-token-card').style.display = 'block';

                    // Enable download buttons
                    document.getElementById('download-json').addEventListener('click', function() {
                        const tokenData = {
                            username: username,
                            photo: grayPhoto,
                            amount: amount
                        };
                        const tokenBlob = new Blob([JSON.stringify(tokenData, null, 2)], { type: 'application/json' });
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(tokenBlob);
                        link.download = `${username}_SDC_Token.json`;
                        link.click();
                    });

                    document.getElementById('download-pdf').addEventListener('click', function() {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        doc.text('SDC Token', 20, 20);
                        doc.text(`Username: ${username}`, 20, 30);
                        doc.text(`Amount Paid: ${amount} ZAR`, 20, 40);
                        doc.text(`Token:`, 20, 50);
                        doc.addImage(grayPhoto, 'JPEG', 20, 60, 50, 50);
                        doc.save(`${username}_SDC_Token.pdf`);
                    });

                    document.getElementById('download-png').addEventListener('click', function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const img = new Image();
                        img.src = grayPhoto;
                        img.onload = function() {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            const link = document.createElement('a');
                            link.href = canvas.toDataURL('image/png');
                            link.download = `${username}_SDC_Token.png`;
                            link.click();
                        };
                    });
                };
            };

            // Read the uploaded photo as data URL
            reader.readAsDataURL(photoInput.files[0]);
        });
    </script>
</body>
</html>
