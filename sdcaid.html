<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDC SDG GRANT PROTOTYPE Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #E0E0E0;
        }
        header {
            background-color: #1F1F1F;
            color: white;
            padding: 20px;
            text-align: center;
        }
        section {
            padding: 20px;
            margin: 10px;
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        button {
            background-color: #00796b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004d40;
        }
        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #1F1F1F;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .hidden {
            display: none;
        }
        #transaction-history {
            list-style-type: none;
            padding: 0;
        }
        #transaction-history li {
            margin: 5px 0;
        }
        .transaction-details {
            background-color: #333;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
</head>
<body>

    <header>
        <h1>SADC CBDC Platform</h1>
    </header>

    <!-- Login Section -->
    <section id="login-section">
        <h2>Login</h2>
        <form id="login-form">
            <label for="login-username">Username:</label>
            <input type="text" id="login-username" required>
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required>
            <button type="submit">Login</button>
        </form>
        <button id="signup-button" onclick="showSignup()">Create Account</button>
    </section>

    <!-- Signup Section -->
    <section id="signup-section" class="hidden">
        <h2>Create Account</h2>
        <form id="signup-form">
            <label for="signup-username">Username:</label>
            <input type="text" id="signup-username" required>
            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" required>
            <button type="submit">Sign Up</button>
        </form>
        <button onclick="showLogin()">Back to Login</button>
    </section>

    <!-- Wallet Section -->
    <section id="wallet-section" class="hidden">
        <h2>Your Wallet</h2>
        <p id="wallet-balance">Balance: 0.00 SDC</p>
        <p id="usd-equivalent">Equivalent in USD: 0.00 USD</p>
        <button onclick="checkBalance()">Check Balance</button>
        <button onclick="logout()">Logout</button>
    </section>

    <!-- Transaction History Section -->
    <section id="transactions-section" class="hidden">
        <h2>Transaction History</h2>
        <ul id="transaction-history">
            <li>No transactions yet.</li>
        </ul>
        <button onclick="downloadCSV()">Download CSV</button>
        <button onclick="downloadPDF()">Download PDF</button>
        <button onclick="downloadReceipt()">Download Receipt</button>
    </section>

    <!-- Send/Receive Section -->
    <section id="send-receive-section" class="hidden">
        <h2>Send/Receive SDC</h2>
        <form id="send-form">
            <label for="receiver-address">Receiver Username:</label>
            <input type="text" id="receiver-address" placeholder="Enter Username" required>
            <label for="amount">Amount (SDC):</label>
            <input type="number" id="amount" min="0.01" step="0.01" required>
            <label for="tax-rate">Tax Rate (%)</label>
            <input type="number" id="tax-rate" min="0" step="0.1" required>
            <button type="submit">Send Payment</button>
        </form>
    </section>

    <!-- MoMo Payment Section -->
    <section id="momo-payment-section" class="hidden">
        <h2>Make MoMo Payment</h2>
        <form id="momo-form">
            <label for="momo-phone">Phone Number:</label>
            <input type="text" id="momo-phone" placeholder="Enter phone number for wallet" required>
            <label for="momo-amount">Amount (ZAR):</label>
            <input type="number" id="momo-amount" min="0.01" step="0.01" required>
            <button type="submit">Make MoMo Payment</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 SADC CBDC Platform | All Rights Reserved</p>
    </footer>

    <script>
        const API_KEY = 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'; // MoMo API Key
        const PRIMARY_KEY = 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'; // MoMo Primary Key
        const SECONDARY_KEY = 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'; // MoMo Secondary Key
        const MOMO_API_URL = 'https://api.mtn.com/momo/payment'; // MoMo API endpoint

        let users = {}; // Simulated user database
        let currentUser = null;
        let sdcToUsdRate = 0.90; // Default SDC to USD exchange rate

        // Fetch live FX Rate (SDC:USD) using an external API
        async function fetchLiveFXRate() {
            const response = await fetch('https://api.exchangerate-api.com/v4/latest/SDC');
            const data = await response.json();
            sdcToUsdRate = data.rates.USD; // Update the live SDC to USD rate
            updateBalance();
        }

        // Function to show signup form
        function showSignup() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.remove('hidden');
        }

        // Function to show login form
        function showLogin() {
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        // Handle user signup
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let username = document.getElementById('signup-username').value;
            let password = document.getElementById('signup-password').value;

            if (username in users) {
                alert("Username already taken!");
            } else {
                users[username] = {
                    password: password,
                    balance: 1000000.00, // Initial balance in SDC
                    transactions: []
                };
                alert("Account created successfully!");
                showLogin();
            }
        });

        // Handle user login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let username = document.getElementById('login-username').value;
            let password = document.getElementById('login-password').value;

            if (username in users && users[username].password === password) {
                currentUser = username;
                showWallet();
                fetchLiveFXRate(); // Fetch live FX rate when user logs in
            } else {
                alert("Invalid username or password");
            }
        });

        // Show wallet and transaction sections after login
        function showWallet() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('wallet-section').classList.remove('hidden');
            document.getElementById('transactions-section').classList.remove('hidden');
            document.getElementById('send-receive-section').classList.remove('hiddenpdateBalance();
        }

        // Logout the user
        function logout() {
            currentUser = null;
            showLogin();
        }

        // Update the wallet balance and USD equivalent
        function updateBalance() {
            if (currentUser) {
                const balanceInSdc = users[currentUser].balance;
                document.getElementById('wallet-balance').innerText = `Balance: ${balanceInSdc} SDC`;
                const usdEquivalent = (balanceInSdc * sdcToUsdRate).toFixed(2);
                document.getElementById('usd-equivalent').innerText = `Equivalent in USD: $${usdEquivalent}`;
            }
        }

        // Function to download the transaction history as CSV
        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Transaction ID,Receipt No,Date,From,To,Amount,Tax,Total\n";
            users[currentUser].transactions.forEach(transaction => {
                let row = [
                    transaction.id,
                    transaction.receiptNumber,
                    transaction.date,
                    transaction.sender,
                    transaction.receiver,
                    transaction.amount,
                    transaction.tax,
                    transaction.totalAmount
                ].join(",");
                csvContent += row + "\n";
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "transaction_history.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Function to download the transaction history as PDF
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.text("Transaction History", 14, 20);
            users[currentUser].transactions.forEach((transaction, index) => {
                let yOffset = 30 + (index * 30);
                doc.text(`Transaction ID: ${transaction.id}`, 14, yOffset);
                doc.text(`Receipt No: ${transaction.receiptNumber}`, 14, yOffset + 10);
                doc.text(`Date: ${transaction.date}`, 14, yOffset + 20);
                doc.text(`From: ${transaction.sender}`, 14, yOffset + 30);
                doc.text(`To: ${transaction.receiver}`, 14, yOffset + 40);
                doc.text(`Amount: ${transaction.amount} SDC`, 14, yOffset + 50);
                doc.text(`Tax: ${transaction.tax} SDC`, 14, yOffset + 60);
                doc.text(`Total (including tax): ${transaction.totalAmount} SDC`, 14, yOffset + 70);
            });

            doc.save("transaction_history.pdf");
        }

        // Function to download a receipt for a transaction
        function downloadReceipt() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let transaction = users[currentUser].transactions[users[currentUser].transactions.length - 1];
            if (!transaction) {
                alert("No transactions to generate receipt.");
                return;
            }

            doc.text("Payment Receipt", 14, 20);
            doc.text(`Transaction ID: ${transaction.id}`, 14, 30);
            doc.text(`Receipt No: ${transaction.receiptNumber}`, 14, 40);
            doc.text(`Date: ${transaction.date}`, 14, 50);
            doc.text(`From: ${transaction.sender}`, 14, 60);
            doc.text(`To: ${transaction.receiver}`, 14, 70);
            doc.text(`Amount: ${transaction.amount} SDC`, 14, 80);
            doc.text(`Tax: ${transaction.tax} SDC`, 14, 90);
            doc.text(`Total: ${transaction.totalAmount} SDC`, 14, 100);

            doc.save(`receipt_${transaction.id}.pdf`);
        }

        // Simulate sending SDC to another user with tax calculation
        document.getElementById('send-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let receiver = document.getElementById('receiver-address').value;
            let amount = parseFloat(document.getElementById('amount').value);
            let taxRate = parseFloat(document.getElementById('tax-rate').value);

            if (!users[receiver]) {
                alert("Receiver does not exist!");
                return;
            }

            if (amount <= 0 || amount > users[currentUser].balance) {
                alert("Invalid amount!");
                return;
            }

            // Calculate tax and total amount
            let taxAmount = (taxRate / 100) * amount;
            let totalAmount = amount + taxAmount;

            if (totalAmount > users[currentUser].balance) {
                alert("Insufficient balance including tax!");
                return;
            }

            // Generate a unique transaction ID and receipt number
            let transactionId = 'TX' + Date.now(); // Example: TX1632025260835
            let receiptNumber = Math.floor(Math.random() * 1000000000);

            // Simulate transaction (including tax)
            users[currentUser].balance -= totalAmount;
            users[receiver].balance += amount; // Transfer only the original amount, tax goes to the platform

            let transaction = {
                id: transactionId, receiptNumber: receiptNumber,
                date: new Date().toLocaleString(),
                sender: currentUser,
                receiver: receiver,
                amount: amount,
                tax: taxAmount,
                totalAmount: totalAmount
            };

            // Log transaction for both sender and receiver
            users[currentUser].transactions.push(transaction);
            users[receiver].transactions.push(transaction);

            // Log the tax deduction (for reporting purposes)
            console.log(`Tax Collected: ${taxAmount} SDC`);

            updateBalance();
            addTransaction();
        });

        // Display transactions with details like transaction ID, receipt number, date/time, tax info
        function addTransaction() {
            const transactionList = document.getElementById('transaction-history');
            transactionList.innerHTML = ''; // Clear the list

            users[currentUser].transactions.forEach(transaction => {
                const transactionItem = document.createElement('li');
                transactionItem.classList.add('transaction-details');
                transactionItem.innerHTML = `
                    <strong>Transaction ID:</strong> ${transaction.id} <br>
                    <strong>Receipt No:</strong> ${transaction.receiptNumber} <br>
                    <strong>Date:</strong> ${transaction.date} <br>
                    <strong>From:</strong> ${transaction.sender} <br>
                    <strong>To:</strong> ${transaction.receiver} <br>
                    <strong>Amount:</strong> ${transaction.amount} SDC <br>
                    <strong>Tax:</strong> ${transaction.tax} SDC <br>
                    <strong>Total (including tax):</strong> ${transaction.totalAmount} SDC
                `;
                transactionList.appendChild(transactionItem);
            });
        }

        // MoMo payment integration
        document.getElementById('momo-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let phoneNumber = document.getElementById('momo-phone').value;
            let momoAmount = parseFloat(document.getElementById('momo-amount').value);

            if (momoAmount <= 0 || momoAmount > users[currentUser].balance) {
                alert("Invalid amount for MoMo payment!");
                return;
            }

            let paymentDetails = {
                phoneNumber: phoneNumber,
                amount: momoAmount,
                currency: 'ZAR',
                primaryKey: PRIMARY_KEY,
                secondaryKey: SECONDARY_KEY
            };

            makeMoMoPayment(paymentDetails);
        });

        // Function to make MoMo payment
        async function makeMoMoPayment(details) {
            const headers = new Headers();
            headers.append("Authorization", `Bearer ${PRIMARY_KEY}:${SECONDARY_KEY}`);
            headers.append("Content-Type", "application/json");

            try {
                const response = await fetch(MOMO_API_URL, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        phoneNumber: details.phoneNumber,
                        amount: details.amount,
                        currency: details.currency
                    })
                });

                const data = await response.json();
                if (data.status === 'SUCCESS') {
                    alert('Payment successful! MoMo transaction ID: ' + data.transactionId);
                    // Deduct MoMo amount from the user's balance
                    users[currentUser].balance -= details.amount;
                    updateBalance();
                } else {
                    alert('Payment failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error processing MoMo payment.');
            }
        }
    </script>

</body>
</html>
