  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADC CBDC Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #005f73;
            color: white;
            padding: 20px;
            text-align: center;
        }

        section {
            padding: 20px;
            margin: 10px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color: #00796b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d40;
        }

        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #005f73;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .hidden {
            display: none;
        }

        #transaction-history {
            list-style-type: none;
            padding: 0;
        }

        #transaction-history li {
            margin: 5px 0;
        }

        .transaction-details {
            background-color: #e0f7fa;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SADC CBDC Platform</h1>
    </header>

    <!-- Login Section -->
    <section id="login-section">
        <h2>Login</h2>
        <form id="login-form">
            <label for="login-username">Username:</label>
            <input type="text" id="login-username" required>
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required>
            <button type="submit">Login</button>
        </form>
        <button id="signup-button" onclick="showSignup()">Create Account</button>
    </section>

    <!-- Signup Section -->
    <section id="signup-section" class="hidden">
        <h2>Create Account</h2>
        <form id="signup-form">
            <label for="signup-username">Username:</label>
            <input type="text" id="signup-username" required>
            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" required>
            <button type="submit">Sign Up</button>
        </form>
        <button onclick="showLogin()">Back to Login</button>
    </section>

    <!-- Wallet Section -->
    <section id="wallet-section" class="hidden">
        <h2>Your Wallet</h2>
        <p id="wallet-balance">Balance: 0.00 SDC</p>
        <button onclick="checkBalance()">Check Balance</button>
        <button onclick="logout()">Logout</button>
    </section>

    <!-- Transaction History Section -->
    <section id="transactions-section" class="hidden">
        <h2>Transaction History</h2>
        <ul id="transaction-history">
            <li>No transactions yet.</li>
        </ul>
    </section>

    <!-- Send/Receive Section -->
    <section id="send-receive-section" class="hidden">
        <h2>Send/Receive SDC</h2>
        <form id="send-form">
            <label for="receiver-address">Receiver Username:</label>
            <input type="text" id="receiver-address" placeholder="Enter Username" required>
            <label for="amount">Amount (SDC):</label>
            <input type="number" id="amount" min="0.01" step="0.01" required>
            <button type="submit">Send Payment</button>
        </form>
    </section>

    <!-- Transfer to Bank Section -->
    <section id="send-to-bank-section" class="hidden">
        <h2>Send SIM to Bank Account</h2>
        <form id="send-to-bank-form">
            <label for="bank-recipient">Bank Account Number:</label>
            <input type="text" id="bank-recipient" placeholder="Enter Bank Account Number" required>
            <label for="bank-amount">Amount (SDC):</label>
            <input type="number" id="bank-amount" min="0.01" step="0.01" required>
            <button type="submit">Send to Bank</button>
        </form>
    </section>

    <!-- Transfer to Crypto Section -->
    <section id="send-to-crypto-section" class="hidden">
        <h2>Send SIM to Crypto Wallet</h2>
        <form id="send-to-crypto-form">
            <label for="crypto-address">Crypto Wallet Address:</label>
            <input type="text" id="crypto-address" placeholder="Enter Crypto Wallet Address" required>
            <label for="crypto-amount">Amount (SDC):</label>
            <input type="number" id="crypto-amount" min="0.01" step="0.01" required>
            <button type="submit">Send to Crypto</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 SADC CBDC Platform | All Rights Reserved</p>
    </footer>

    <script>
        let users = {}; // Simulated user database
        let currentUser = null;

        // Show the signup form
        function showSignup() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.remove('hidden');
        }

        // Show the login form
        function showLogin() {
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        // Handle user signup
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let username = document.getElementById('signup-username').value;
            let password = document.getElementById('signup-password').value;

            if (username in users) {
                alert("Username already taken!");
            } else {
                users[username] = {
                    password: password,
                    balance: 1000000.00, // Set initial balance to 1,000,000.00 SDC
                    transactions: []
                };
                alert("Account created successfully!");
                showLogin();
            }
        });

        // Handle user login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let username = document.getElementById('login-username').value;
            let password = document.getElementById('login-password').value;

            if (username in users && users[username].password === password) {
                currentUser = username;
                showWallet();
            } else {
                alert("Invalid username or password");
            }
        });

        // Show wallet and transaction sections after login
        function showWallet() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('wallet-section').classList.remove('hidden');
            document.getElementById('transactions-section').classList.remove('hidden');
            document.getElementById('send-receive-section').classList.remove('hidden');
            document.getElementById('send-to-bank-section').classList.remove('hidden');
            document.getElementById('send-to-crypto-section').classList.remove('hidden');
            updateBalance();
        }

        // Logout the user
        function logout() {
            currentUser = null;
            showLogin();
        }

        // Update the wallet balance
        function updateBalance() {
            if (currentUser) {
                document.getElementById('wallet-balance').innerText = `Balance: ${users[currentUser].balance} SDC`;
            }
        }

        // Simulate sending SDC to another user
        document.getElementById('send-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let receiver = document.getElementById('receiver-address').value;
            let amount = parseFloat(document.getElementById('amount').value);

            if (!users[receiver]) {
                alert("Receiver does not exist!");
                return;
            }

            if (amount <= 0 || amount > users[currentUser].balance) {
                alert("Invalid amount!");
                return;
            }

            // Generate a unique transaction ID and receipt number
            let transactionId = 'TX' + Date.now(); // Example: TX1632025260835
            let receiptNumber = Math.floor(Math.random() * 1000000000);

            // Simulate transaction
            users[currentUser].balance -= amount;
            users[receiver].balance += amount;

            let transaction = {
                id: transactionId,
                receiptNumber: receiptNumber,
                date: new Date().toLocaleString(),
                sender: currentUser,
                receiver: receiver,
                amount: amount
            };

            // Log transaction for both sender and receiver
            users[currentUser].transactions.push(transaction);
            users[receiver].transactions.push(transaction);

            updateBalance();
            addTransaction();
        });

        // Simulate sending SDC to a bank account
        document.getElementById('send-to-bank-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let bankAccount = document.getElementById('bank-recipient').value;
            let amount = parseFloat(document.getElementById('bank-amount').value);

            if (amount <= 0 || amount > users[currentUser].balance) {
                alert("Invalid amount!");
                return;
            }

            // Generate a unique transaction ID and receipt number for the bank transfer
            let transactionId = 'TX-BANK' + Date.now(); 
            let receiptNumber = Math.floor(Math.random() * 1000000000);

            // Simulate transaction to bank
            users[currentUser].balance -= amount;

            let transaction = {
                id: transactionId,
                receiptNumber: receiptNumber,
                date: new Date().toLocaleString(),
                sender: currentUser,
                receiver: `Bank Account: ${bankAccount}`,
                amount: amount
            };

            // Log transaction for the sender
            users[currentUser].transactions.push(transaction);

            updateBalance();
            addTransaction();
            alert(`Payment sent to bank account ${bankAccount}.`);
        });

        // Simulate sending SDC to a crypto wallet
        document.getElementById('send-to-crypto-form').addEventListener('submit', function(e) {
            e.preventDefault();

            let cryptoWallet = document.getElementById('crypto-address').value;
            let amount = parseFloat(document.getElementById('crypto-amount').value);

            if (amount <= 0 || amount > users[currentUser].balance) {
                alert("Invalid amount!");
                return;
            }

            // Generate a unique transaction ID and receipt number for the crypto transfer
            let transactionId = 'TX-CRYPTO' + Date.now();
            let receiptNumber = Math.floor(Math.random() * 1000000000);

            // Simulate transaction to crypto wallet
            users[currentUser].balance -= amount;

            let transaction = {
                id: transactionId,
                receiptNumber: receiptNumber,
                date: new Date().toLocaleString(),
                sender: currentUser,
                receiver: `Crypto Wallet: ${cryptoWallet}`,
                amount: amount
            };

            // Log transaction for the sender
            users[currentUser].transactions.push(transaction);

            updateBalance();
            addTransaction();
            alert(`Payment sent to crypto wallet ${cryptoWallet}.`);
        });

        // Display transactions with details like transaction ID, receipt number, date/time
        function addTransaction() {
            const transactionList = document.getElementById('transaction-history');
            transactionList.innerHTML = ''; // Clear the list

            users[currentUser].transactions.forEach(transaction => {
                const transactionItem = document.createElement('li');
                transactionItem.classList.add('transaction-details');
                transactionItem.innerHTML = `
                    <strong>Transaction ID:</strong> ${transaction.id} <br>
                    <strong>Receipt No:</strong> ${transaction.receiptNumber} <br>
                    <strong>Date:</strong> ${transaction.date} <br>
                    <strong>From:</strong> ${transaction.sender} <br>
                    <strong>To:</strong> ${transaction.receiver} <br>
                    <strong>Amount:</strong> ${transaction.amount} SDC
                `;
                transactionList.appendChild(transactionItem);
            });
        }

        // Check balance function
        function checkBalance() {
            updateBalance();
        }
    </script>

</body>
</html>
